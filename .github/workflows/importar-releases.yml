name: Importar release 1.1.9

on:
  push:
    paths:
      - '.github/workflows/importar-releases.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar artefactos públicos de la release anterior
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          base="https://github.com/msanchez07/docente-curso/releases/download/v1.1.9"
          for archivo in \
            AulaNova-mac-arm64.dmg \
            AulaNova-mac-x64.dmg \
            AulaNova-win-x64-setup.exe \
            AulaNova-linux-x86_64.AppImage \
            aula-nova_amd64.deb \
            latest-mac.yml \
            latest.yml \
            latest-linux.yml; do
            echo "Descargando $archivo"
            curl -fL --retry 3 --retry-delay 2 "$base/$archivo" -o "release/$archivo"
          done

      - name: Publicar release en el repositorio público
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.9
          target_commitish: main
          name: Aula Nova v1.1.9
          body: |
            Release 1.1.9 migrada al repositorio público de Aula Nova.

            Incluye la corrección de la edición de sesiones desde el calendario de
            Programación de aula.
          files: release/*
          fail_on_unmatched_files: true
